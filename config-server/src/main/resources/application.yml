server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    # profil "native" = les fichiers de config sont lus sur le disque (pas dans un depot Git)
    active: native
  cloud:
    config:
      server:
        native:
          # En local : le dossier config-repo a la racine du projet.
          # En Docker : le dossier est monte sur /config-repo (voir docker-compose.yml).
          search-locations: ${CONFIG_REPO_LOCATION:file:./config-repo}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}

management:
  endpoints:
    web:
      exposure:
        include: health,info
