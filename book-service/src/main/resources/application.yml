spring:
  application:
    # Ce nom determine le fichier lu chez le config-server : config-repo/book-service.yml
    name: book-service
  config:
    # Pas de "optional:" : mieux vaut refuser de demarrer que demarrer mal configure.
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      fail-fast: true
      retry:
        max-attempts: 20
        initial-interval: 2000
        max-interval: 5000
